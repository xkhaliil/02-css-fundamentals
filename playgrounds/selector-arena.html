<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🏮%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector Arena · Night Market edition</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="../assets/kit.css">
  <script src="../assets/kit.js" defer></script>
  <style>
    html, body { height: 100%; }
    body.page { display: flex; flex-direction: column; min-height: 100vh; }
    .arena { flex: 1; display: grid; grid-template-columns: minmax(18rem, 25rem) minmax(0, 1fr); gap: 1.25rem; padding: 1.25rem; min-height: 0; }
    .arena-brief { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; }
    .brand { display: flex; justify-content: space-between; align-items: center; font: 700 0.8rem var(--font-mono); }
    .brand a { color: var(--ink); }
    .brand h1 { font: 800 1.5rem/1 var(--font-sans); letter-spacing: -0.02em; margin: 0; }
    .brand h1 em { font-family: var(--font-serif); font-weight: 400; }
    .levels { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0; padding: 0; list-style: none; }
    .levels button { width: 2.1rem; height: 2.1rem; border-radius: 0.4rem; border: 2px solid var(--ink); background: var(--white); font: 700 0.8rem var(--font-mono); cursor: pointer; color: var(--ink); }
    .levels button.done { background: var(--green); color: #fff; }
    .levels button[aria-current="true"] { background: var(--ink); color: var(--yellow); }
    .level-card { background: var(--white); border: 2px solid var(--ink); border-radius: 0.9rem; padding: 1.1rem 1.2rem; box-shadow: 5px 5px 0 var(--ink); }
    .level-card small { font: 700 0.72rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .level-card h2 { font: 800 1.5rem/1.1 var(--font-sans); margin: 0.3rem 0 0.4rem; letter-spacing: -0.02em; }
    .level-card p { margin: 0; font-size: 1.05rem; }
    .syntax { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 2px dashed var(--line); font-size: 0.95rem; }
    .syntax code { font: 700 0.95em var(--font-mono); background: var(--paper-2); padding: 0.1em 0.35em; border-radius: 0.25em; }
    .syntax[hidden] { display: none; }
    .answer-row { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
    .answer-row input { font: 700 1.2rem var(--font-mono); padding: 0.75rem 0.9rem; border: 2px solid var(--ink); border-radius: 0.6rem; background: var(--white); color: var(--ink); min-width: 0; }
    .answer-row input:focus { outline: none; box-shadow: 4px 4px 0 var(--tomato); }
    .answer-row button, .ghost { font: 800 1rem var(--font-sans); border: 2px solid var(--ink); border-radius: 0.6rem; background: var(--yellow); padding: 0 1.1rem; cursor: pointer; color: var(--ink); }
    .ghost { background: transparent; font-weight: 600; font-size: 0.85rem; padding: 0.45rem 0.8rem; }
    .answer-row.shake { animation: shake 0.35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
    .feedback { min-height: 3.2rem; font-size: 1rem; }
    .feedback.good { color: #0b5c3f; font-weight: 700; }
    .feedback.bad { color: #b3290b; }
    .helpers { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .play { display: grid; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1rem; min-height: 0; }
    .table {
      position: relative;
      border: 3px solid var(--ink);
      border-radius: 1rem;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(255 210 120 / 0.55), transparent 60%),
        repeating-linear-gradient(90deg, #a86b3c 0 90px, #9c6134 90px 92px),
        #a86b3c;
      overflow: hidden;
      display: grid;
      place-items: center;
      min-height: 16rem;
    }
    .table::before { content: "🏮 🏮 🏮 🏮 🏮 🏮 🏮"; position: absolute; top: 0.4rem; left: 0; right: 0; text-align: center; font-size: 1.4rem; letter-spacing: 1.2rem; opacity: 0.9; }
    .task-bubble { position: absolute; top: 2.6rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--yellow); font: 700 1rem var(--font-sans); padding: 0.45rem 0.9rem; border-radius: 99px; white-space: nowrap; }
    .scene { display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: flex-end; justify-content: center; padding: 5rem 1.5rem 2rem; }

    /* the market goods — real elements, styled by tag name */
    .scene crate, .scene basket, .scene shelf, .scene plate { display: flex; align-items: flex-end; gap: 0.35rem; position: relative; }
    .scene crate { padding: 0.9rem 0.8rem 0.6rem; border: 6px solid #6b3d18; border-top-width: 3px; border-radius: 0.3rem; background: repeating-linear-gradient(0deg, #d69a5b 0 14px, #c3864a 14px 17px); box-shadow: 0 6px 0 rgb(0 0 0 / 0.25); }
    .scene basket { padding: 0.6rem 1rem 0.9rem; border: 5px solid #8a6424; border-radius: 0.5rem 0.5rem 2.5rem 2.5rem; background: repeating-linear-gradient(45deg, #e4c07b 0 7px, #cfa75d 7px 14px); box-shadow: 0 6px 0 rgb(0 0 0 / 0.25); }
    .scene shelf { padding: 0.4rem 1.2rem 0.2rem; border-bottom: 14px solid #5a3514; border-radius: 0 0 0.3rem 0.3rem; background: rgb(0 0 0 / 0.12); }
    .scene apple, .scene lemon, .scene fish, .scene bread, .scene cheese { display: grid; place-items: center; width: 3.6rem; height: 3.6rem; font-size: 2.7rem; line-height: 1; position: relative; }
    .scene apple::before { content: "🍏"; }
    .scene apple.ripe::before { content: "🍎"; }
    .scene lemon::before { content: "🍋"; }
    .scene fish::before { content: "🐟"; }
    .scene bread::before { content: "🥖"; }
    .scene cheese::before { content: "🧀"; }
    .scene #golden { filter: drop-shadow(0 0 10px gold) drop-shadow(0 0 4px gold); }
    .scene #golden::after { content: "✨"; position: absolute; top: -0.5rem; right: -0.6rem; font-size: 1.3rem; }
    .scene [sale]::after { content: "%"; position: absolute; top: -0.3rem; right: -0.3rem; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--tomato); color: #fff; font: 800 0.85rem/1.5rem var(--font-sans); text-align: center; border: 2px solid var(--ink); }

    .scene .t { animation: dance 0.6s ease-in-out infinite alternate; }
    .scene crate.t, .scene basket.t, .scene shelf.t { animation: dance-box 0.6s ease-in-out infinite alternate; }
    @keyframes dance { from { transform: translateY(0) rotate(-7deg); } to { transform: translateY(-10px) rotate(7deg); } }
    @keyframes dance-box { from { transform: translateY(0) rotate(-1.5deg); } to { transform: translateY(-5px) rotate(1.5deg); } }
    .scene .hit { outline: 4px dashed var(--yellow); outline-offset: 3px; border-radius: 0.6rem; }
    .scene .hover { outline: 3px solid #fff; outline-offset: 3px; border-radius: 0.6rem; }
    .scene.win .t { animation: fly 0.7s ease-in forwards; }
    @keyframes fly { to { transform: translateY(-260px) rotate(50deg) scale(0.6); opacity: 0; } }
    .tip-tag { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--code-ink); font: 600 0.8rem var(--font-mono); padding: 0.35rem 0.55rem; border-radius: 0.35rem; white-space: nowrap; transform: translate(-50%, -130%); }
    .code-view { margin: 0; background: var(--code-bg); color: var(--code-ink); border: 3px solid var(--ink); border-radius: 1rem; padding: 0.8rem 0; overflow: auto; font: 400 0.95rem/1.55 var(--font-mono); }
    .code-view .ln { display: block; padding: 0 1.2rem; white-space: pre; border-left: 4px solid transparent; }
    .code-view .ln.hover { background: rgb(255 255 255 / 0.08); }
    .code-view .ln.t { border-left-color: var(--tomato); }
    .done-banner { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgb(23 20 15 / 0.82); color: var(--paper); z-index: 6; }
    .done-banner h2 { font: 800 3rem/1 var(--font-sans); margin: 0 0 0.5rem; }
    .done-banner h2 em { font-family: var(--font-serif); font-weight: 400; color: var(--yellow); }
    @media (max-width: 800px) { .arena { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="page">
  <div class="arena">
    <div class="arena-brief">
      <div class="brand"><h1>Selector <em>Arena</em></h1><a href="../index.html">all materials</a></div>
      <ul class="levels" id="levels" aria-label="Levels"></ul>
      <div class="level-card">
        <small id="lvl-num"></small>
        <h2 id="lvl-title"></h2>
        <p id="lvl-task"></p>
        <div class="syntax" id="lvl-syntax" hidden></div>
      </div>
      <form class="answer-row" id="form" autocomplete="off">
        <input id="answer" spellcheck="false" autocapitalize="off" placeholder="type a selector, press Enter" aria-label="Your selector">
        <button type="submit">Go</button>
      </form>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="helpers">
        <button class="ghost" type="button" id="hint">💡 Show the syntax</button>
        <button class="ghost" type="button" id="giveup">🏳 Show an answer</button>
        <button class="ghost" type="button" id="reset">↺ Reset progress</button>
      </div>
      <p class="muted" style="font-size:.85rem;color:var(--muted);margin-top:auto">Wobbling items are the ones to select. Your selector is tested for real with <code>querySelectorAll()</code> — any selector that picks exactly those items wins.</p>
    </div>
    <div class="play">
      <div class="table" id="table">
        <div class="task-bubble" id="bubble"></div>
        <div class="scene" id="scene"></div>
      </div>
      <pre class="code-view" id="code" aria-label="The HTML of the table"></pre>
    </div>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const LEVELS = [
      { title: "Type selector", task: "Select every lemon.", target: "lemon",
        syntax: "<code>lemon</code> — a bare tag name selects every element of that type. On a real page: <code>p</code>, <code>h2</code>, <code>a</code>.",
        markup: "<lemon/><apple/><lemon/><bread/>" },
      { title: "Type selector, again", task: "Select the crates, not the basket.", target: "crate",
        syntax: "Containers are elements too. <code>crate</code> selects the box itself, not what's in it.",
        markup: "<crate><apple/></crate><basket><lemon/></basket><crate><fish/></crate>" },
      { title: "Class selector", task: "Select everything that's ripe.", target: ".ripe",
        syntax: "<code>.ripe</code> — a dot + name selects every element with <code>class=\"ripe\"</code>, whatever its tag.",
        markup: "<apple class=\"ripe\"/><apple/><lemon class=\"ripe\"/><apple class=\"ripe\"/>" },
      { title: "Id selector", task: "Select the golden apple.", target: "#golden",
        syntax: "<code>#golden</code> — a hash + name selects the one element with <code>id=\"golden\"</code>. Ids must be unique on a page.",
        markup: "<apple class=\"ripe\"/><apple id=\"golden\" class=\"ripe\"/><apple/><apple class=\"ripe\"/>" },
      { title: "Tag + class", task: "Only the ripe apples. Leave the ripe lemons alone.", target: "apple.ripe",
        syntax: "<code>apple.ripe</code> — no space: one element that is an <code>apple</code> <em>and</em> has class <code>ripe</code>.",
        markup: "<apple class=\"ripe\"/><lemon class=\"ripe\"/><apple/><apple class=\"ripe\"/><lemon/>" },
      { title: "Descendant combinator", task: "Select apples that are somewhere inside a crate.", target: "crate apple",
        syntax: "<code>crate apple</code> — a space means “inside, at any depth”. The most expensive space in CSS.",
        markup: "<crate><apple/><basket><apple class=\"ripe\"/></basket></crate><apple/><basket><apple/></basket>" },
      { title: "Child combinator", task: "Lemons sitting directly in a crate — not the ones in the basket inside it.", target: "crate > lemon",
        syntax: "<code>crate &gt; lemon</code> — only direct children, one level down.",
        markup: "<crate><lemon/><basket><lemon/></basket><lemon/></crate><basket><lemon/></basket>" },
      { title: "Grouping", task: "Select all fish and all bread in one go.", target: "fish, bread",
        syntax: "<code>fish, bread</code> — a comma makes a list. Same declarations, several selectors.",
        markup: "<fish/><apple/><bread/><crate><fish/><lemon/></crate><bread/>" },
      { title: "Attribute selector", task: "Select everything on sale.", target: "[sale]",
        syntax: "<code>[sale]</code> selects elements that have that attribute. <code>[type=\"email\"]</code> also checks the value.",
        markup: "<fish sale/><apple/><bread sale/><lemon/><crate><apple sale/><lemon/></crate>" },
      { title: ":first-child", task: "Select the first item in every crate.", target: "crate > :first-child",
        syntax: "<code>:first-child</code> — a pseudo-class: an element that's first among its siblings. Try <code>crate &gt; :first-child</code>.",
        markup: "<crate><apple/><lemon/><lemon/></crate><crate><fish/><apple/></crate><lemon/>" },
      { title: ":nth-child()", task: "Every second item on the shelf.", target: "shelf > :nth-child(even)",
        syntax: "<code>:nth-child(even)</code>, <code>:nth-child(2n)</code>, <code>:nth-child(3)</code>… positions start at 1.",
        markup: "<shelf><apple/><lemon/><lemon/><fish/><apple/><bread/></shelf>" },
      { title: "Next-sibling combinator", task: "The lemon placed right after a fish (garnish!).", target: "fish + lemon",
        syntax: "<code>fish + lemon</code> — a lemon that comes immediately after a fish, same parent.",
        markup: "<fish/><lemon/><apple/><lemon/><crate><fish/><lemon/><lemon/></crate>" },
      { title: ":not()", task: "Unripe apples go back to the farm.", target: "apple:not(.ripe)",
        syntax: "<code>apple:not(.ripe)</code> — apples, except the ones that match <code>.ripe</code>.",
        markup: "<apple class=\"ripe\"/><apple/><lemon/><apple/><apple class=\"ripe\"/><apple/>" },
      { title: ":has() — the parent selector", task: "Select the crates that contain fish. They smell.", target: "crate:has(fish)",
        syntax: "<code>crate:has(fish)</code> selects the <em>crate</em>, if something inside matches <code>fish</code>. New since 2023.",
        markup: "<crate><apple/></crate><crate><fish/></crate><basket><fish/></basket><crate><lemon/><fish/></crate>" },
      { title: "Boss level", task: "In baskets that hold something ripe, grab the items that are NOT ripe.", target: "basket:has(.ripe) > :not(.ripe)",
        syntax: "Chain what you know: <code>basket:has(…)</code> + <code>&gt;</code> + <code>:not(…)</code>.",
        markup: "<basket><apple class=\"ripe\"/><apple/><lemon/></basket><basket><apple/><lemon/></basket><crate><apple class=\"ripe\"/><apple/></crate>" },
    ];

    const $ = (id) => document.getElementById(id);
    const scene = $("scene"), code = $("code"), input = $("answer"), fb = $("feedback");
    const store = {
      get() { try { return JSON.parse(localStorage.getItem("arena-done") || "[]"); } catch (e) { return []; } },
      set(v) { try { localStorage.setItem("arena-done", JSON.stringify(v)); } catch (e) {} },
    };
    let done = new Set(store.get());
    let cur = 0;
    const expand = (m) => m.replace(/<(\w+)([^>]*?)\/>/g, "<$1$2></$1>");
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function levelButtons() {
      $("levels").innerHTML = "";
      LEVELS.forEach((l, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = i + 1;
        b.title = l.title;
        if (done.has(i)) b.classList.add("done");
        if (i === cur) b.setAttribute("aria-current", "true");
        b.onclick = () => load(i);
        const li = document.createElement("li");
        li.append(b);
        $("levels").append(li);
      });
    }

    function load(i) {
      cur = Math.max(0, Math.min(LEVELS.length - 1, i));
      const L = LEVELS[cur];
      $("lvl-num").textContent = `Level ${cur + 1} of ${LEVELS.length}`;
      $("lvl-title").textContent = L.title;
      $("lvl-task").textContent = L.task;
      $("bubble").textContent = L.task;
      $("lvl-syntax").innerHTML = L.syntax;
      $("lvl-syntax").hidden = cur > 0 && !done.has(cur);
      $("table").querySelector(".done-banner")?.remove();
      scene.classList.remove("win");
      scene.innerHTML = expand(L.markup);
      scene.querySelectorAll(L.target).forEach((el) => el.classList.add("t"));
      // code view, one line per opening/closing tag, linked to the element
      code.textContent = "";
      const lines = [];
      (function walk(node, depth) {
        for (const el of node.children) {
          const attrs = [...el.attributes].filter((a) => a.name !== "class" || a.value.replace(/\b(t|hit|hover)\b/g, "").trim())
            .map((a) => a.name === "class" ? ` class="${a.value.replace(/\b(t|hit|hover)\b/g, "").trim()}"` : a.value === "" ? ` ${a.name}` : ` ${a.name}="${a.value}"`).join("");
          const open = `<${el.localName}${attrs}>`;
          if (!el.children.length) lines.push([depth, open + `</${el.localName}>`, el]);
          else { lines.push([depth, open, el]); walk(el, depth + 1); lines.push([depth, `</${el.localName}>`, el]); }
        }
      })(scene, 0);
      const wrap = (html, depth) => "  ".repeat(depth) + html;
      code.innerHTML = [`<span class="ln">${window.Kit ? Kit.hl("html", '<div class="table">') : esc('<div class="table">')}</span>`]
        .concat(lines.map(([d, t], k) => `<span class="ln" data-k="${k}">${wrap(window.Kit ? Kit.hl("html", t) : esc(t), d + 1)}</span>`))
        .concat([`<span class="ln">${window.Kit ? Kit.hl("html", "</div>") : esc("</div>")}</span>`]).join("");
      const lineEls = [...code.querySelectorAll(".ln[data-k]")];
      lines.forEach(([, , el], k) => {
        (el._lines = el._lines || []).push(lineEls[k]);
        if (el.classList.contains("t")) lineEls[k].classList.add("t");
      });
      input.value = "";
      fb.textContent = "";
      fb.className = "feedback";
      levelButtons();
      input.focus({ preventScroll: true });
    }

    // hover: show the tag and light up its code line
    let tip;
    scene.addEventListener("mouseover", (e) => {
      const el = e.target.closest(".scene *");
      clearHover();
      if (!el || el === scene) return;
      el.classList.add("hover");
      (el._lines || []).forEach((l) => l.classList.add("hover"));
      tip = document.createElement("div");
      tip.className = "tip-tag";
      const cls = el.className.replace(/\b(t|hit|hover)\b/g, "").trim();
      tip.textContent = `<${el.localName}${el.id ? ` id="${el.id}"` : ""}${cls ? ` class="${cls}"` : ""}${el.hasAttribute("sale") ? " sale" : ""}>`;
      const r = el.getBoundingClientRect(), t = $("table").getBoundingClientRect();
      tip.style.left = r.left - t.left + r.width / 2 + "px";
      tip.style.top = r.top - t.top + "px";
      $("table").append(tip);
    });
    scene.addEventListener("mouseleave", clearHover);
    function clearHover() {
      scene.querySelectorAll(".hover").forEach((x) => x.classList.remove("hover"));
      code.querySelectorAll(".hover").forEach((x) => x.classList.remove("hover"));
      tip && tip.remove();
    }

    // live preview while typing
    function matches(sel) {
      try { return [...scene.querySelectorAll(sel)]; } catch (e) { return null; }
    }
    input.addEventListener("input", () => {
      scene.querySelectorAll(".hit").forEach((x) => x.classList.remove("hit"));
      const sel = input.value.trim();
      if (!sel) return;
      const m = matches(sel);
      if (m) m.forEach((x) => x.classList.add("hit"));
    });
    input.addEventListener("keydown", (e) => e.stopPropagation());

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const sel = input.value.trim();
      if (!sel) return;
      const m = matches(sel);
      const targets = [...scene.querySelectorAll(".t")];
      const row = $("form");
      const fail = (msg) => {
        fb.textContent = msg;
        fb.className = "feedback bad";
        row.classList.remove("shake");
        void row.offsetWidth;
        row.classList.add("shake");
      };
      if (!m) return fail("The browser can't read that selector. In a stylesheet, the whole rule would be ignored.");
      const ok = m.length === targets.length && m.every((x) => x.classList.contains("t"));
      if (!ok) {
        const extra = m.filter((x) => !x.classList.contains("t")).length;
        const missing = targets.filter((x) => !m.includes(x)).length;
        return fail(`Selected ${m.length}. ${missing ? missing + " wobbling item" + (missing > 1 ? "s" : "") + " missed. " : ""}${extra ? extra + " extra picked up." : ""}`);
      }
      done.add(cur);
      store.set([...done]);
      scene.classList.add("win");
      fb.innerHTML = `✓ <code>${esc(sel)}</code> — specificity ${window.Kit ? "(" + Kit.specificity(sel).map((r) => r.s.join(",")).join(" / ") + ")" : ""}`;
      fb.className = "feedback good";
      $("lvl-syntax").hidden = false;
      levelButtons();
      setTimeout(() => {
        if (cur < LEVELS.length - 1) load(cur + 1);
        else if (done.size === LEVELS.length) {
          const d = document.createElement("div");
          d.className = "done-banner";
          d.innerHTML = `<div><h2>Market <em>cleared.</em></h2><p>All ${LEVELS.length} levels. You speak selector now.</p></div>`;
          $("table").append(d);
        }
      }, 1100);
    });

    $("hint").onclick = () => { $("lvl-syntax").hidden = false; };
    $("giveup").onclick = () => { input.value = LEVELS[cur].target; input.dispatchEvent(new Event("input")); input.focus(); };
    $("reset").onclick = () => { done = new Set(); store.set([]); load(0); };
    document.addEventListener("keydown", (e) => {
      if (e.target === input) return;
      if (e.key === "ArrowRight" && window.parent === window) load(cur + 1);
      if (e.key === "ArrowLeft" && window.parent === window) load(cur - 1);
    });

    const first = LEVELS.findIndex((_, i) => !done.has(i));
    load(first < 0 ? 0 : first);
  });
  </script>
</body>
</html>
